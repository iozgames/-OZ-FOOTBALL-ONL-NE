<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Oyunu - Sohbet</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e8eaed;
    --muted: #8b93a3;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
  }
  .screen h1 { margin: 0 0 8px; font-size: 20px; }
  .screen p { color: var(--muted); font-size: 13px; max-width: 300px; margin: 0; }
  .btn {
    padding: 12px 22px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    font-size: 15px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type=text] {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    width: 260px;
    text-align: center;
  }
  #error-box { color: #ff6b6b; font-size: 13px; min-height: 18px; max-width: 300px; }
  #config-warning {
    color: #ffb347;
    font-size: 12px;
    max-width: 320px;
    line-height: 1.5;
  }
  #chat-screen {
    display: none;
    flex: 1;
    flex-direction: column;
    max-width: 640px;
    margin: 0 auto;
    width: 100%;
    padding: 12px;
    height: 100vh;
  }
  #chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px 12px;
    border-bottom: 1px solid var(--border);
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px 4px;
  }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; background: var(--panel); }
  .msg .name { font-size: 12px; color: var(--accent); margin-bottom: 2px; }
  .msg .content { font-size: 14px; word-wrap: break-word; white-space: pre-wrap; }
  .msg .time { font-size: 10px; color: var(--muted); margin-top: 4px; }
  .msg.own { align-self: flex-end; background: #23324f; }
  #input-row {
    display: flex;
    gap: 8px;
    padding: 12px 4px;
    border-top: 1px solid var(--border);
  }
  #input-row input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    text-align: left;
  }
</style>
</head>
<body>

<div id="auth-screen" class="screen">
  <h1>Test Oyunu</h1>
  <button id="google-btn" class="btn btn-primary">Google ile Giriş Yap</button>
  <div id="auth-error" class="error"></div>
</div>

<div id="username-screen" class="screen" style="display:none;">
  <h1>Oyuncu Adı Seç</h1>
  <p>Sohbette görünecek, kullanılmayan bir oyuncu adı belirle.</p>
  <input id="username-input" type="text" placeholder="Oyuncu adı" maxlength="20">
  <button id="username-submit-btn" class="btn btn-primary">Devam Et</button>
  <div id="username-error" class="error"></div>
</div>

<div id="chat-screen">
  <div id="chat-header">
    <span id="user-label"></span>
    <button id="logout-btn" class="btn">Çıkış Yap</button>
  </div>
  <div id="messages"></div>
  <div id="input-row">
    <input id="message-input" type="text" maxlength="500" placeholder="Mesajınızı yazın...">
    <button id="send-btn" class="btn btn-primary" style="width:auto;">Gönder</button>
  </div>
</div>

<div id="error-box" style="position:fixed; bottom:8px; left:8px; right:8px; color:#ff6b6b; font-size:12px; text-align:center;"></div>
<div id="config-warning" style="position:fixed; top:8px; left:8px; right:8px;"></div>

<script type="module">
  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signInWithRedirect,
    getRedirectResult,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore,
    collection,
    doc,
    getDoc,
    runTransaction,
    addDoc,
    query,
    orderBy,
    limit,
    onSnapshot,
    getDocs,
    deleteDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ============================================================
  // Firebase Console > Project settings > Your apps (Web) kısmından
  // aldığın config.
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyCsSWXCV669KbXVSFzslxsZGYpwB_KitcM",
    authDomain: "fotbalonline1.firebaseapp.com",
    projectId: "fotbalonline1",
    storageBucket: "fotbalonline1.firebasestorage.app",
    messagingSenderId: "714198105774",
    appId: "1:714198105774:web:f0cd081eba8ed76fb7773f"
  };
  // ============================================================

  const MAX_MESSAGES = 20;

  let app, auth, db, provider;
  let currentUser = null;
  let playerName = null;
  let unsubscribe = null;
  const configOk = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('BURAYA');

  const authScreen = document.getElementById('auth-screen');
  const usernameScreen = document.getElementById('username-screen');
  const chatScreen = document.getElementById('chat-screen');
  const errorBox = document.getElementById('error-box');
  const usernameError = document.getElementById('username-error');
  const configWarning = document.getElementById('config-warning');
  const messagesEl = document.getElementById('messages');
  const userLabel = document.getElementById('user-label');
  const usernameInput = document.getElementById('username-input');
  const usernameSubmitBtn = document.getElementById('username-submit-btn');

  function showError(msg) { errorBox.textContent = msg || ''; }
  function showUsernameError(msg) { usernameError.textContent = msg || ''; }

  window.addEventListener('error', (e) => showError('Beklenmeyen hata: ' + e.message));
  window.addEventListener('unhandledrejection', (e) => showError('Beklenmeyen hata: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));

  function translateAuthError(e) {
    const code = e.code || '';
    if (code.includes('unauthorized-domain')) return 'Bu site adresi Firebase\'de izinli domain listesinde değil (Authentication > Settings > Authorized domains).';
    if (code.includes('popup-closed-by-user')) return 'Giriş penceresi kapatıldı, tekrar dene.';
    return (e.message || 'Bir hata oluştu.') + (code ? ' (kod: ' + code + ')' : '');
  }

  function showScreen(name) {
    authScreen.style.display = name === 'auth' ? 'flex' : 'none';
    usernameScreen.style.display = name === 'username' ? 'flex' : 'none';
    chatScreen.style.display = name === 'chat' ? 'flex' : 'none';
  }

  if (!configOk) {
    configWarning.textContent = 'Firebase ayarları eksik.';
    document.getElementById('google-btn').disabled = true;
  } else {
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);
    provider = new GoogleAuthProvider();

    // Yönlendirmeyle (redirect) geri dönüldüyse sonucu yakala.
    getRedirectResult(auth).catch((e) => showError(translateAuthError(e)));

    document.getElementById('google-btn').onclick = async () => {
      showError('');
      try {
        // Önce açılır pencere (popup) dene - genelde en güvenilir yöntem.
        await signInWithPopup(auth, provider);
      } catch (e) {
        const code = e.code || '';
        if (code.includes('popup-blocked') || code.includes('cancelled-popup-request') || code.includes('operation-not-supported')) {
          // Popup engellendiyse sayfa yönlendirmesine geç.
          signInWithRedirect(auth, provider);
        } else if (!code.includes('popup-closed-by-user')) {
          showError(translateAuthError(e));
        }
      }
    };

    document.getElementById('logout-btn').onclick = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if (!user) {
        playerName = null;
        showScreen('auth');
        if (unsubscribe) { unsubscribe(); unsubscribe = null; }
        return;
      }

      try {
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        if (userDoc.exists() && userDoc.data().username) {
          playerName = userDoc.data().username;
          userLabel.textContent = playerName;
          showScreen('chat');
          startListening();
        } else {
          showScreen('username');
        }
      } catch (e) {
        showError(translateAuthError(e));
      }
    });

    usernameSubmitBtn.onclick = async () => {
      showUsernameError('');
      const name = usernameInput.value.trim();
      if (name.length < 3 || name.length > 20) {
        return showUsernameError('Oyuncu adı 3-20 karakter arası olmalı.');
      }
      if (!/^[a-zA-Z0-9ÇçĞğİıÖöŞşÜü_ ]+$/.test(name)) {
        return showUsernameError('Sadece harf, rakam, boşluk ve alt çizgi kullanılabilir.');
      }

      const key = name.toLowerCase();
      usernameSubmitBtn.disabled = true;
      try {
        await runTransaction(db, async (tx) => {
          const usernameRef = doc(db, 'usernames', key);
          const takenSnap = await tx.get(usernameRef);
          if (takenSnap.exists()) {
            throw new Error('TAKEN');
          }
          tx.set(usernameRef, { uid: currentUser.uid });
          tx.set(doc(db, 'users', currentUser.uid), { username: name });
        });
        playerName = name;
        userLabel.textContent = playerName;
        showScreen('chat');
        startListening();
      } catch (e) {
        if (e.message === 'TAKEN') {
          showUsernameError('Bu oyuncu adı zaten alınmış, başka bir tane dene.');
        } else {
          showUsernameError(translateAuthError(e));
        }
      } finally {
        usernameSubmitBtn.disabled = false;
      }
    };

    function startListening() {
      const messagesRef = collection(db, 'messages');
      const q = query(messagesRef, orderBy('createdAt', 'desc'), limit(MAX_MESSAGES));
      unsubscribe = onSnapshot(q, (snapshot) => {
        const list = [];
        snapshot.forEach((d) => list.push({ id: d.id, ...d.data() }));
        list.reverse(); // en eski üstte, en yeni altta
        renderMessages(list);
      });
    }

    function renderMessages(list) {
      messagesEl.innerHTML = '';
      for (const m of list) {
        const div = document.createElement('div');
        div.className = 'msg' + (currentUser && m.uid === currentUser.uid ? ' own' : '');
        const time = m.createdAt && m.createdAt.toDate
          ? m.createdAt.toDate().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })
          : '';
        div.innerHTML = `
          <div class="name">${escapeHtml(m.name)}</div>
          <div class="content">${escapeHtml(m.content)}</div>
          <div class="time">${escapeHtml(time)}</div>
        `;
        messagesEl.appendChild(div);
      }
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str ?? '';
      return d.innerHTML;
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const content = input.value.trim();
      if (!content || !currentUser || !playerName) return;
      input.value = '';
      try {
        await addDoc(collection(db, 'messages'), {
          uid: currentUser.uid,
          name: playerName,
          content: content.slice(0, 500),
          createdAt: serverTimestamp()
        });
        await pruneOldMessages();
      } catch (e) {
        showError(e.message);
      }
    }

    // Sadece son 20 mesajı tut; 21. mesaj geldiğinde en eskisini sil.
    async function pruneOldMessages() {
      const messagesRef = collection(db, 'messages');
      const q = query(messagesRef, orderBy('createdAt', 'asc'));
      const snapshot = await getDocs(q);
      const extra = snapshot.size - MAX_MESSAGES;
      if (extra > 0) {
        const toDelete = snapshot.docs.slice(0, extra);
        await Promise.all(toDelete.map((d) => deleteDoc(d.ref)));
      }
    }

    document.getElementById('send-btn').onclick = sendMessage;
    document.getElementById('message-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  }
</script>
</body>
</html>
