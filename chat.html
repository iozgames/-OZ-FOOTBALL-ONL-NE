<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Oyunu - Sohbet</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e8eaed;
    --muted: #8b93a3;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #auth-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
  }
  #auth-screen h1 { margin: 0 0 8px; font-size: 20px; }
  .btn {
    padding: 12px 22px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    font-size: 15px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #error-box { color: #ff6b6b; font-size: 13px; min-height: 18px; max-width: 300px; }
  #config-warning {
    color: #ffb347;
    font-size: 12px;
    max-width: 320px;
    line-height: 1.5;
  }
  #chat-screen {
    display: none;
    flex: 1;
    flex-direction: column;
    max-width: 640px;
    margin: 0 auto;
    width: 100%;
    padding: 12px;
    height: 100vh;
  }
  #chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px 12px;
    border-bottom: 1px solid var(--border);
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px 4px;
  }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; background: var(--panel); }
  .msg .name { font-size: 12px; color: var(--accent); margin-bottom: 2px; }
  .msg .content { font-size: 14px; word-wrap: break-word; white-space: pre-wrap; }
  .msg .time { font-size: 10px; color: var(--muted); margin-top: 4px; }
  .msg.own { align-self: flex-end; background: #23324f; }
  #input-row {
    display: flex;
    gap: 8px;
    padding: 12px 4px;
    border-top: 1px solid var(--border);
  }
  #input-row input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
  }
</style>
</head>
<body>

<div id="auth-screen">
  <h1>Test Oyunu</h1>
  <button id="google-btn" class="btn btn-primary">Google ile Giriş Yap</button>
  <div id="error-box"></div>
  <div id="config-warning"></div>
</div>

<div id="chat-screen">
  <div id="chat-header">
    <span id="user-label"></span>
    <button id="logout-btn" class="btn">Çıkış Yap</button>
  </div>
  <div id="messages"></div>
  <div id="input-row">
    <input id="message-input" type="text" maxlength="500" placeholder="Mesajınızı yazın...">
    <button id="send-btn" class="btn btn-primary" style="width:auto;">Gönder</button>
  </div>
</div>

<script type="module">
  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithRedirect,
    getRedirectResult,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    limit,
    onSnapshot,
    getDocs,
    deleteDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ============================================================
  // Firebase Console > Project settings > Your apps (Web) kısmından
  // aldığın config.
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyCsSWXCV669KbXVSFzslxsZGYpwB_KitcM",
    authDomain: "fotbalonline1.firebaseapp.com",
    projectId: "fotbalonline1",
    storageBucket: "fotbalonline1.firebasestorage.app",
    messagingSenderId: "714198105774",
    appId: "1:714198105774:web:f0cd081eba8ed76fb7773f"
  };
  // ============================================================

  const MAX_MESSAGES = 20;

  let app, auth, db, provider, currentUser = null, unsubscribe = null;
  const configOk = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('BURAYA');

  const authScreen = document.getElementById('auth-screen');
  const chatScreen = document.getElementById('chat-screen');
  const errorBox = document.getElementById('error-box');
  const configWarning = document.getElementById('config-warning');
  const messagesEl = document.getElementById('messages');
  const userLabel = document.getElementById('user-label');

  function showError(msg) { errorBox.textContent = msg || ''; }

  window.addEventListener('error', (e) => showError('Beklenmeyen hata: ' + e.message));
  window.addEventListener('unhandledrejection', (e) => showError('Beklenmeyen hata: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));

  if (!configOk) {
    configWarning.textContent = 'Firebase ayarları eksik. Dosyanın üstündeki "firebaseConfig" alanını doldurman gerekiyor.';
    document.getElementById('google-btn').disabled = true;
  } else {
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);
    provider = new GoogleAuthProvider();

    // Sayfa Google'dan yönlendirmeyle mi geri döndü? Kontrol et.
    getRedirectResult(auth).catch((e) => showError((e.message || 'Giriş hatası') + ' (kod: ' + (e.code || '-') + ')'));

    document.getElementById('google-btn').onclick = () => {
      showError('');
      signInWithRedirect(auth, provider);
    };

    document.getElementById('logout-btn').onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        authScreen.style.display = 'none';
        chatScreen.style.display = 'flex';
        userLabel.textContent = user.displayName || user.email || 'Oyuncu';
        startListening();
      } else {
        chatScreen.style.display = 'none';
        authScreen.style.display = 'flex';
        if (unsubscribe) { unsubscribe(); unsubscribe = null; }
      }
    });

    function startListening() {
      const messagesRef = collection(db, 'messages');
      const q = query(messagesRef, orderBy('createdAt', 'desc'), limit(MAX_MESSAGES));
      unsubscribe = onSnapshot(q, (snapshot) => {
        const list = [];
        snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
        list.reverse(); // en eski üstte, en yeni altta
        renderMessages(list);
      });
    }

    function renderMessages(list) {
      messagesEl.innerHTML = '';
      for (const m of list) {
        const div = document.createElement('div');
        div.className = 'msg' + (currentUser && m.uid === currentUser.uid ? ' own' : '');
        const time = m.createdAt && m.createdAt.toDate
          ? m.createdAt.toDate().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })
          : '';
        div.innerHTML = `
          <div class="name">${escapeHtml(m.name)}</div>
          <div class="content">${escapeHtml(m.content)}</div>
          <div class="time">${escapeHtml(time)}</div>
        `;
        messagesEl.appendChild(div);
      }
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str ?? '';
      return d.innerHTML;
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const content = input.value.trim();
      if (!content || !currentUser) return;
      input.value = '';
      try {
        await addDoc(collection(db, 'messages'), {
          uid: currentUser.uid,
          name: currentUser.displayName || currentUser.email || 'Oyuncu',
          content: content.slice(0, 500),
          createdAt: serverTimestamp()
        });
        await pruneOldMessages();
      } catch (e) {
        showError(e.message);
      }
    }

    // Sadece son 20 mesajı tut; 21. mesaj geldiğinde en eskisini sil.
    async function pruneOldMessages() {
      const messagesRef = collection(db, 'messages');
      const q = query(messagesRef, orderBy('createdAt', 'asc'));
      const snapshot = await getDocs(q);
      const extra = snapshot.size - MAX_MESSAGES;
      if (extra > 0) {
        const toDelete = snapshot.docs.slice(0, extra);
        await Promise.all(toDelete.map((d) => deleteDoc(d.ref)));
      }
    }

    document.getElementById('send-btn').onclick = sendMessage;
    document.getElementById('message-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  }
</script>
</body>
</html>
